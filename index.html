<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>R&K serie's</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #222;
}
.ventana-secreta {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  color: #9cff9c;
  font-family: "Courier New", monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 200;
  padding: 40px;
}

.ventana-box {
  max-width: 600px;
}

.cerrar {
  position: absolute;
  top: 20px;
  right: 25px;
  cursor: pointer;
  font-size: 22px;
}

#fondo {
  position: fixed;
  inset: 0;
  background-image: url("https://i.imgur.com/HCLWyvj.png");
  background-size: cover;
  background-position: center;
  filter: hue-rotate(0deg);
  animation: colores 20s linear infinite;
}

@keyframes colores {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}

/* BOTONES PRINCIPALES */
#botones {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 20;
}

button {
  padding: 10px 18px;
  border-radius: 15px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  background: #7CFF9B;
  transition: 0.2s;
}

button:hover { transform: scale(1.1); }
button:active { background: #55cc7a; }

/* BOTONES EDICIÓN */
#fondoEditor, #personajeEditor, #guardarPersonaje {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  gap: 10px;
  z-index: 20;
}

/* PERSONAJES FLOTANTES */
.personaje {
  position: absolute;
  width: 120px;
  cursor: pointer;
  transition: transform 0.2s;
}

.personaje:hover { transform: scale(1.1); }
.nombre {
  position: absolute;
  bottom: 125px;
  left: 0;
  width: 120px;
  text-align: center;
  color: white;
  font-weight: bold;
  text-shadow: 1px 1px 4px black;
  pointer-events: none;
}

/* OVERLAY PERFIL */
#perfilOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 50;
}

#perfilBox {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

.perfilBtn {
  padding: 15px 30px;
  margin: 10px;
  border: none;
  border-radius: 15px;
  font-size: 18px;
  cursor: pointer;
}

#glen { background: #7CFF9B; }
#oliver { background: #FFA94D; }
</style>
<style id="nemur-chat-styles">

/* ===============================
   ACCESO SECRETO Y CHAT DE NÉMUR
   =============================== */
#acceso-secreto-zona {
  position: fixed;
  top: auto;
  bottom: 7%;
  right: 5%;
  width: 150px;
  height: 125px;
  z-index: 110;
  display: none;
  cursor: pointer;
}
#acceso-secreto-boton {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 112px;
  height: 94px;
  object-fit: contain;
  opacity: 0;
  transform: scale(.94);
  transition: opacity .65s ease, transform .65s ease;
  pointer-events: none;
}
#acceso-secreto-zona:hover #acceso-secreto-boton {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

#password-overlay, #chat-nemur, #evento-ruta2, #aviso-falso, #pantalla-glitch {
  position: fixed;
  inset: 0;
  z-index: 500;
}
#password-overlay {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.94);
  color: #f1f1f1;
  font-family: Arial, sans-serif;
}
.password-ventana {
  position: relative;
  width: min(390px, calc(100vw - 44px));
  box-sizing: border-box;
  padding: 34px 28px 28px;
  background: #202020;
  border: 1px solid #555;
  text-align: center;
  box-shadow: 0 12px 45px rgba(0,0,0,.55);
}
.password-cerrar {
  position: absolute;
  top: 10px;
  right: 14px;
  padding: 4px 7px;
  color: #ddd;
  background: transparent;
  font-size: 19px;
}
.password-ventana h2 {
  margin: 0 0 22px;
  font-size: 19px;
  font-weight: 500;
}
#password-input {
  box-sizing: border-box;
  width: 100%;
  padding: 11px;
  color: #eee;
  background: #111;
  border: 1px solid #666;
  border-radius: 3px;
  outline: none;
}
#password-enviar { margin-top: 15px; }
#password-error {
  min-height: 18px;
  margin: 13px 0 0;
  color: #ff4545;
  font-size: 13px;
}
#password-overlay.transicion-negra {
  background: #000;
}
#password-overlay.transicion-negra .password-ventana {
  display: none;
}

#chat-nemur {
  display: flex;
  flex-direction: column;
  background: #e9ecef;
  color: #20242a;
  font-family: Arial, sans-serif;
  z-index: 510;
}
.chat-cabecera {
  flex: 0 0 auto;
  min-height: 68px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 16px;
  box-sizing: border-box;
  background: #252a31;
  color: white;
  box-shadow: 0 2px 7px rgba(0,0,0,.2);
}
.chat-avatar {
  position: relative;
  width: 43px;
  height: 43px;
  flex: 0 0 43px;
  border-radius: 50%;
  background: #858585;
  overflow: hidden;
}
.chat-avatar::before {
  content: "";
  position: absolute;
  top: 8px;
  left: 15px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #dedede;
}
.chat-avatar::after {
  content: "";
  position: absolute;
  left: 8px;
  bottom: -5px;
  width: 28px;
  height: 23px;
  border-radius: 50% 50% 35% 35%;
  background: #dedede;
}
.chat-identidad { flex: 1; min-width: 0; }
.chat-nombre { font-size: 15px; font-weight: 600; }
#chat-estado { margin-top: 4px; color: #aeb8c3; font-size: 11px; }
.chat-cerrar {
  padding: 7px 10px;
  color: white;
  background: transparent;
  font-size: 21px;
}
#chat-mensajes {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 18px clamp(12px, 4vw, 42px) 14px;
  box-sizing: border-box;
  background: #e9ecef;
}
.chat-fila { display: flex; width: 100%; margin: 9px 0; }
.chat-fila.jugador { justify-content: flex-end; }
.chat-fila.desconocido { justify-content: flex-start; }
.chat-burbuja {
  max-width: min(78%, 570px);
  padding: 11px 14px;
  border-radius: 13px;
  font-size: 14px;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.chat-fila.jugador .chat-burbuja {
  background: #cfe4c9;
  border-bottom-right-radius: 4px;
}
.chat-fila.desconocido .chat-burbuja {
  background: #fff;
  border-bottom-left-radius: 4px;
}
#chat-opciones {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  max-height: 34vh;
  overflow-y: auto;
  padding: 12px 14px 16px;
  box-sizing: border-box;
  background: #f7f8f9;
  border-top: 1px solid #d4d8dc;
}
#chat-opciones button {
  max-width: 100%;
  padding: 10px 14px;
  border: 1px solid #b7c0c8;
  border-radius: 18px;
  background: #fff;
  color: #303942;
  font-size: 13px;
  line-height: 1.35;
}
#chat-opciones button:disabled { opacity: .55; cursor: default; }
.chat-fin {
  width: 100%;
  padding: 8px;
  color: #7b858d;
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
}

#evento-ruta2 {
  z-index: 520;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: 'Courier New', monospace;
}
#ruta2-letra {
  font-size: clamp(90px, 20vw, 190px);
  color: #f4f4f4;
  text-shadow: 0 0 22px rgba(255,255,255,.35);
  animation: letra-aparece 1.2s ease both;
}
@keyframes letra-aparece {
  from { opacity: 0; transform: scale(.8); }
  to { opacity: 1; transform: scale(1); }
}
#ruta2-imagen {
  position: absolute;
  left: 18px;
  bottom: 18px;
  width: min(180px, 28vw);
  max-height: 34vh;
  object-fit: contain;
  cursor: pointer;
  animation: imagen-aparece .8s ease both;
}
@keyframes imagen-aparece { from {opacity:0;} to {opacity:1;} }

#aviso-falso {
  z-index: 530;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.48);

}
.aviso-caja {
  width: min(440px, calc(100vw - 36px));
  padding: 20px;
  box-sizing: border-box;
  background: #f7f7f7;
  color: #222;
  border: 1px solid #c7c7c7;

}
.aviso-titulo { margin-bottom: 14px; font-size: 14px; font-weight: 600; }
.aviso-texto { font-size: 14px; line-height: 1.5; }
.aviso-acciones { display: flex; justify-content: flex-end; margin-top: 20px; }
.aviso-acciones button { border-radius: 5px; background: #dce8f8; color: #222; }

#pantalla-glitch {
  z-index: 540;
  overflow: hidden;

}
.glitch-punto {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  animation: punto-parpadea .45s steps(2,end) infinite alternate;
}
@keyframes punto-parpadea { from { opacity: .25; } to { opacity: 1; } }

@media (max-width: 600px) {
  #acceso-secreto-zona { top: auto; bottom: 5%; right: 3%; transform: scale(.85); transform-origin: bottom right; }
  .chat-burbuja { max-width: 88%; }
  #chat-opciones { max-height: 40vh; }
}


/* ===============================
   EXPERIMENTO DEL CASSETTE
   =============================== */
#cassette-capturable {
  position: absolute; z-index: 545; width: 94px; height: 76px;
  padding: 0; border: 0; border-radius: 0; background: transparent;
  opacity: .16; transition: opacity .08s linear, left .32s ease-out, top .32s ease-out, transform .32s linear; cursor: crosshair;
  touch-action: manipulation;
}
#cassette-capturable:hover, #cassette-capturable:focus-visible { opacity: 1; }
#cassette-capturable img {

#experimento-password, #cassette-experimento, #llamada-nemur {

}
#experimento-password {
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.96); color: #eee;
}
.experimento-password-caja {
  position: relative; width: min(410px, calc(100vw - 36px));
  padding: 42px 28px 28px; box-sizing: border-box;
  background: #1c1c1c; border: 1px solid #555; text-align: center;
  box-shadow: 0 12px 45px rgba(0,0,0,.6);
}
.experimento-password-caja h2 { margin: 0 0 22px; font-size: 18px; font-weight: 500; }
.experimento-password-caja input {
  width: 100%; box-sizing: border-box; padding: 12px; color: #eee;
  background: #090909; border: 1px solid #666; outline: none;
}
.experimento-password-caja button:not(.experimento-cerrar) { margin-top: 15px; }
.experimento-cerrar, .cassette-salir {
  position: absolute; z-index: 5; top: 13px; right: 17px;
  padding: 4px 9px; background: transparent; color: white; font-size: 27px; line-height: 1;
}
#experimento-password-error { min-height: 18px; margin: 14px 0 0; color: #ff3d3d; font-size: 13px; }
#cassette-experimento {
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; background: #000;
}
.cassette-imagen {
  display: block; max-width: 100vw; max-height: 100vh;

}
.cassette-salir { position: fixed; }
#cinta-arrastre-zona {
  position: absolute; left: 50%; top: 50%; width: min(76vw, 760px); height: 170px;
  transform: translate(-50%, -50%); display: flex; align-items: center;

}
#cinta-arrastre-zona:active { cursor: grabbing; }
#cinta-simulada {
  position: relative; width: 100%; height: 17px;
  border-top: 2px solid #393939; border-bottom: 2px solid #242424;
  background: repeating-linear-gradient(90deg, #101010 0 17px, #1b1b1b 17px 20px, #0b0b0b 20px 38px);
  box-shadow: 0 0 9px rgba(255,255,255,.08); transform: rotate(-13deg);
}
#cinta-simulada::before, #cinta-simulada::after {
  content: ""; position: absolute; top: -9px; width: 34px; height: 31px;
  border: 2px solid #303030; border-radius: 50%; background: #080808;
}
#cinta-simulada::before { left: 9%; }
#cinta-simulada::after { right: 9%; }
#nota-numero {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .35s ease;
}
#nota-numero.visible { opacity: 1; }
.nota-numero-texto {
  width: min(310px, 72vw); min-height: 190px; display: flex;
  align-items: center; justify-content: center; box-sizing: border-box; padding: 30px;
  background: #f4f1e9; color: #171717; box-shadow: 0 8px 30px rgba(0,0,0,.55);
  font-family: "Courier New", monospace; font-size: clamp(34px, 8vw, 52px);
  letter-spacing: 7px; transform: rotate(-2deg);
}
#llamada-nemur {
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, #343434 0%, #111 72%, #050505 100%);
  color: white; font-family: Arial, sans-serif;
}
.llamada-contenido {
  width: min(340px, calc(100vw - 38px)); display: flex;
  flex-direction: column; align-items: center; gap: 18px;
}
.llamada-contacto { font-size: 23px; letter-spacing: 1px; }
#llamada-estado { min-height: 17px; color: #bcbcbc; font-size: 12px; }
#llamada-numero {
  width: 100%; min-height: 34px; text-align: center; font-size: 27px;
  letter-spacing: 8px; border-bottom: 1px solid #555;
}
.llamada-teclado {
  display: grid; grid-template-columns: repeat(3, 68px); gap: 12px 17px; justify-content: center;
}
.llamada-teclado button {
  width: 68px; height: 58px; padding: 0; border-radius: 50%;
  background: rgba(255,255,255,.12); color: white; font-size: 22px;
}
#llamada-colgar {
  width: 68px; height: 58px; padding: 0; border-radius: 30px;
  background: #4b4b4b; color: #999; font-size: 26px; cursor: not-allowed;
}
#llamada-colgar.habilitado { background: #c52d36; color: white; cursor: pointer; }
.chat-llamar {
  flex: 0 0 auto; padding: 7px 9px; background: transparent;
  color: white; font-size: 25px; line-height: 1;
}
@media (hover: none) { #cassette-capturable { opacity: .3; } }
@media (max-width: 600px) {
  #cinta-arrastre-zona { width: 88vw; height: 145px; }
  .llamada-teclado { gap: 10px 13px; }
}

</style>
</head>
<body>

<div id="fondo"></div>

<!-- OVERLAY PERFIL -->
<div id="perfilOverlay">
  <div id="perfilBox">
    <h2>¿Quién eres?</h2>
    <button id="glen" class="perfilBtn" onclick="elegirPerfil('glen')">Glen</button>
    <button id="oliver" class="perfilBtn" onclick="elegirPerfil('oliver')">Oliver</button>
  </div>
</div>

<!-- BOTONES PRINCIPALES -->
<div id="botones">
  <button onclick="modoMusica()">Agregar música</button>
  <button onclick="modoAgregarPersonajes()">Agregar personajes</button>
  <button onclick="modoEditarFondo()">Editar fondo</button>
  <button onclick="modoEditarPersonajes()">Editar personajes</button>
</div>

<!-- BOTONES EDICIÓN FONDO -->
<div id="fondoEditor">
  <button onclick="agregarElementoFondo()">Agregar elemento</button>
  <button onclick="guardarFondo()">Guardar</button>
</div>

<!-- BOTONES EDICIÓN PERSONAJES -->
<div id="personajeEditor">
  <button onclick="guardarPersonajes()">Guardar cambios</button>
</div>

<!-- BOTÓN GUARDAR PERSONAJE NUEVO -->
<div id="guardarPersonaje">
  <button onclick="guardarNuevoPersonaje()">Guardar</button>
</div>

<!-- INPUTS OCULTOS -->
<input type="file" id="musicInput" accept="audio/*" hidden>
<input type="file" id="imgInput" accept="image/png" hidden>
<input type="file" id="elementoFondoInput" accept="image/png" hidden>
<input type="file" id="soundInput" accept="audio/*" hidden>

<script>
let perfil = "oliver";

window.onload = () => {
  const overlay = document.getElementById("perfilOverlay");
  if (overlay) overlay.remove();

  document.getElementById("botones").style.display = "none";
};

let audios = [];
let personajes = [];
let agregandoPersonaje = false;

// --- PERFIL ---
function elegirPerfil(p) {
  perfil = p;
  document.getElementById("perfilOverlay").style.display = "none";
  if(perfil === "glen") document.getElementById("botones").style.display = "flex";
  else document.getElementById("botones").style.display = "none";
}

// --- MÚSICA ---
function modoMusica() { if(perfil !== "glen") return; document.getElementById("musicInput").click(); }
document.getElementById("musicInput").onchange = e => {
  const audio = new Audio(URL.createObjectURL(e.target.files[0]));
  audio.loop = true;
  audio.play();
  audios.push(audio);
}

// --- AGREGAR PERSONAJES ---
function modoAgregarPersonajes() {
  if(perfil !== "glen") return;
  agregandoPersonaje = true;
  ocultarBotones(true);

  const addBtn = document.createElement("button");
  addBtn.id = "agregarPersonajeBtn";
  addBtn.textContent = "+";
  addBtn.style.position = "fixed";
  addBtn.style.bottom = "80px";
  addBtn.style.left = "40%";
  addBtn.style.transform = "translateX(-50%)";
  addBtn.style.zIndex = 20;
  addBtn.onclick = () => document.getElementById("imgInput").click();
  document.body.appendChild(addBtn);

  document.getElementById("guardarPersonaje").style.display = "flex";
}

// Evitar que un nuevo personaje aparezca encima de otro
function getPosicionLibre() {
  let left, top, intento=0;
  do {
    left = Math.random()*70;
    top = Math.random()*60;
    intento++;
    let choca = personajes.some(p => {
      const dx = left - parseFloat(p.element.style.left);
      const dy = top - parseFloat(p.element.style.top);
      return Math.sqrt(dx*dx + dy*dy) < 20;
    });
    if(!choca) break;
  } while(intento<100);
  return {left, top};
}

document.getElementById("imgInput").onchange = e => {
  const file = e.target.files[0];
  const img = document.createElement("img");
  img.src = URL.createObjectURL(file);
  img.className = "personaje";

  const pos = getPosicionLibre();
  img.style.left = pos.left + "%";
  img.style.top = pos.top + "%";

  const sonido = new Audio();
  const vel = {vx: (Math.random()*0.5-0.25), vy: (Math.random()*0.5-0.25)};
  img.vel = vel;
  img.onclick = () => { if(sonido) sonido.play(); };

  const tiempoCreacion = Date.now();
  document.body.appendChild(img);
  personajes.push({element: img, sonido: sonido, nombre: "", vel: vel, label: null, controls: null, tiempoCreacion});
}

// --- GUARDAR NUEVO PERSONAJE ---
function guardarNuevoPersonaje() {
  agregandoPersonaje = false;
  document.getElementById("guardarPersonaje").style.display = "none";
  const addBtn = document.getElementById("agregarPersonajeBtn");
  if(addBtn) addBtn.remove();
  ocultarBotones(false);
}

// --- FONDO ---
function modoEditarFondo() { if(perfil !== "glen") return; ocultarBotones(true); document.getElementById("fondoEditor").style.display = "flex"; }
function agregarElementoFondo() { document.getElementById("elementoFondoInput").click(); }
document.getElementById("elementoFondoInput").onchange = e => {
  const file = e.target.files[0];
  const img = document.createElement("img");
  img.src = URL.createObjectURL(file);
  img.style.position = "absolute";
  img.style.left = "50%";
  img.style.top = "50%";
  img.style.transform = "translate(-50%, -50%)";
  img.style.pointerEvents = "none";
  document.body.appendChild(img);
}
function guardarFondo() { ocultarBotones(false); document.getElementById("fondoEditor").style.display = "none"; }

// --- EDITAR PERSONAJES ---
function modoEditarPersonajes() {
  if(perfil !== "glen") return;
  ocultarBotones(true);
  document.getElementById("personajeEditor").style.display = "flex";

  personajes.forEach(p => {
    if(p.controls) p.controls.remove();

    const contenedor = document.createElement("div");
    contenedor.style.position = "absolute";
    contenedor.style.left = p.element.style.left;
    contenedor.style.top = `calc(${p.element.style.top} + 130px)`;
    contenedor.style.zIndex = 30;

    // BOTÓN NOMBRE
    const nombreBtn = document.createElement("button");
    nombreBtn.textContent = "✏️";
    nombreBtn.onclick = () => {
      const nombre = prompt("Escribe el nombre del personaje:", p.nombre);
      if(nombre!==null) {
        p.nombre = nombre;
        if(!p.label) {
          const label = document.createElement("div");
          label.className = "nombre";
          p.label = label;
          document.body.appendChild(label);

// --- ANIMACIÓN FLOTACIÓN NATURAL ---
function animarPersonajes() {
  personajes.forEach(p => {
   if (p.arrastrando) return;
    const el = p.element;
    let left = parseFloat(el.style.left);
    let top = parseFloat(el.style.top);

    // mover suavemente
    left += p.vel.vx;
    top += p.vel.vy;

    // rebote bordes
    if(left < 0){ left=0; p.vel.vx=Math.abs(p.vel.vx); }
    if(left > 80){ left=80; p.vel.vx=-Math.abs(p.vel.vx); }
    if(top < 0){ top=0; p.vel.vy=Math.abs(p.vel.vy); }
    if(top > 80){ top=80; p.vel.vy=-Math.abs(p.vel.vy); }

    // flotación natural
    p.vel.vx += (Math.random()*0.2-0.1)*0.05;
    p.vel.vy += (Math.random()*0.2-0.1)*0.05;

    // suavizar velocidad
    p.vel.vx *= 0.98;
    p.vel.vy *= 0.98;

    el.style.left = left + "%";
    el.style.top = top + "%";

    if(p.label){
      p.label.style.left = el.style.left;
      p.label.style.top = `calc(${el.style.top} - 25px)`;
    }
  });

  requestAnimationFrame(animarPersonajes);
}

let offsetY = 0;

  const target = e.target;
  if (!target.classList.contains("personaje")) return;

  personajeArrastrado = personajes.find(p => p.element === target);
  if (!personajeArrastrado) return;

  const rect = target.getBoundingClientRect();

  offsetX = e.clientX - rect.left;
  offsetY = e.clientY - rect.top;

  // fijamos posición en px (CRUCIAL)
  target.style.position = "fixed";
  target.style.left = rect.left + "px";
  target.style.top = rect.top + "px";

  // congelamos flotación
  personajeArrastrado.vel.vx = 0;
  personajeArrastrado.vel.vy = 0;
  personajeArrastrado.arrastrando = true;

  target.style.zIndex = "500";
  e.preventDefault();
});

document.addEventListener("mousemove", (e) => {
  if (!personajeArrastrado) return;

  personajeArrastrado.element.style.left =
    e.clientX - offsetX + "px";
  personajeArrastrado.element.style.top =
    e.clientY - offsetY + "px";
});
document.addEventListener("mouseup", () => {
  if (!personajeArrastrado) return;

  const el = personajeArrastrado.element;

  // posición actual en px
  const rect = el.getBoundingClientRect();

  // convertir a %
  const leftPercent = (rect.left / window.innerWidth) * 100;
  const topPercent = (rect.top / window.innerHeight) * 100;

  el.style.left = leftPercent + "%";
  el.style.top = topPercent + "%";
  el.style.position = "absolute";
  el.style.zIndex = "30";

  personajeArrastrado.arrastrando = false;

function reproducirMusicaRuta2() {
  try {

    audioRuta2.src = MUSICAFONDO566_URL;

    // Efecto de saturación/distorsión para darle un sonido más inquietante.
    const AudioContextRuta2 = window.AudioContext || window.webkitAudioContext;
    if (AudioContextRuta2) {
      const contexto = new AudioContextRuta2();
      const fuente = contexto.createMediaElementSource(audioRuta2);
      const distorsion = contexto.createWaveShaper();
      const cantidad = 260;
      const curva = new Float32Array(44100);
      for (let i = 0; i < curva.length; i++) {
        const x = (i * 2) / curva.length - 1;
        curva[i] = ((3 + cantidad) * x * 20 * Math.PI / 180) / (Math.PI + cantidad * Math.abs(x));
      }
      distorsion.curve = curva;
      distorsion.oversample = "4x";
      fuente.connect(distorsion);
      distorsion.connect(contexto.destination);
      contexto.resume().catch(() => {});
    }
    audioRuta2.play().catch(err => console.warn("El navegador bloqueó la reproducción automática:", err));
  } catch (e) {
    console.warn("No se pudo aplicar la saturación; se intentará reproducir el audio normal.", e);
    try {
      if (audioRuta2) audioRuta2.play().catch(() => {});
    } catch (_) {}
  }
}

}

function volverMenuPrincipalExperimento() {
  clearInterval(temporizadorCassette);
  temporizadorCassette = null;
  clearTimeout(temporizadorAvisoRuta2);
  ["experimento-password", "cassette-experimento", "llamada-nemur",
   "pantalla-glitch", "evento-ruta2", "aviso-falso", "chat-nemur"].forEach(id => {
    const elemento = document.getElementById(id);
    if (elemento) elemento.remove();
  });
  [audioRuta2, audioSecreto, audioLlamada01, audioLlamada02].forEach(audio => {
    if (audio) {
      audio.pause();
      try { audio.currentTime = 0; } catch (_) {}
    }
  });
  audioRuta2 = audioSecreto = audioLlamada01 = audioLlamada02 = null;
}

// La llamada sólo se habilita después de revelar el número.
function abrirPantallaLlamada() {
  if (!llamadaDesbloqueada || document.getElementById("llamada-nemur")) return;
  const llamada = document.createElement("div");
  llamada.id = "llamada-nemur";
  llamada.innerHTML = `
    <div class="llamada-contenido">
      <div class="llamada-contacto">desconocido</div>
      <div id="llamada-estado">llamada en curso...</div>
      <div id="llamada-numero" aria-live="polite"></div>
      <div class="llamada-teclado">
        ${["1","2","3","4","5","6","7","8","9","*","0","#"].map(n => `<button type="button" data-num="${n}">${n}</button>`).join("")}
      </div>
      <button id="llamada-colgar" type="button" disabled aria-label="Terminar llamada">☎</button>
    </div>
  `;
  document.body.appendChild(llamada);
  const pantallaNumero = llamada.querySelector("#llamada-numero");
  const estado = llamada.querySelector("#llamada-estado");
  const colgar = llamada.querySelector("#llamada-colgar");
  let marcado = "", audio02Iniciado = false, audio02Reproducido = false;
  function actualizarNumero() { pantallaNumero.textContent = marcado; }
  function iniciarAudio02() {
    if (!audio02Iniciado || audio02Reproducido || !llamada.isConnected) return;
    audio02Reproducido = true;
    estado.textContent = "conectado...";
    audioLlamada02 = new Audio(DESCONOCIDO02_URL);
    audioLlamada02.loop = false;
    audioLlamada02.volume = 1;
    const habilitarColgar = () => {
      estado.textContent = "";
      colgar.disabled = false;
      colgar.classList.add("habilitado");
    };
    audioLlamada02.onended = habilitarColgar;
    audioLlamada02.onerror = habilitarColgar;
    audioLlamada02.play().catch(err => {
      console.warn("No se pudo reproducir desconocido02:", err);
      habilitarColgar();
    });
  }
  function procesarNumero() {
    if (marcado.length !== CODIGO_LLAMADA.length || audio02Iniciado) return;
    if (marcado === CODIGO_LLAMADA) {
      audio02Iniciado = true;
      estado.textContent = "esperando...";
      // No interrumpimos desconocido01 al introducir el código.
      // El segundo audio comienza únicamente cuando termina el primero.
      if (!audioLlamada01 || audioLlamada01.ended) {
        iniciarAudio02();
      }
    } else {
      estado.textContent = "contraseña incorrecta";
      marcado = "";
      actualizarNumero();
      setTimeout(() => {
        if (document.getElementById("llamada-nemur") && !audio02Iniciado) estado.textContent = "";
      }, 2000);
    }
  }
  llamada.querySelectorAll("[data-num]").forEach(boton => {
    boton.addEventListener("click", () => {
      if (audio02Iniciado || marcado.length >= 6) return;
      marcado += boton.dataset.num;
      actualizarNumero();
      procesarNumero();
    });
  });
  colgar.addEventListener("click", () => {
    if (!colgar.disabled) volverMenuPrincipalExperimento();
  });
  audioLlamada01 = new Audio(DESCONOCIDO01_URL);
  audioLlamada01.loop = false;
  audioLlamada01.volume = 1;
  audioLlamada01.onended = () => {
    if (audio02Iniciado) iniciarAudio02();
  };
  audioLlamada01.onerror = () => {
    if (audio02Iniciado) iniciarAudio02();
    else estado.textContent = "";
  };
  audioLlamada01.play().catch(err => {
    console.warn("No se pudo reproducir desconocido01:", err);
    estado.textContent = "";
    if (audio02Iniciado) iniciarAudio02();
  });
}
